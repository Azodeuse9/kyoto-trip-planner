  <text x="236" y="136" fill="#222222" font-family="Arial, sans-serif" font-size="26" font-weight="700">Kyoto Trip Planner</text>
  <text x="236" y="168" fill="#717171" font-family="Arial, sans-serif" font-size="18">Your weekend, thoughtfully planned.</text>
  <rect x="164" y="196" width="400" height="164" rx="26" fill="#F7F7F7"/>
  <text x="188" y="242" fill="#222222" font-family="Arial, sans-serif" font-size="22">Hi! Where would you like to explore next?</text>
  <text x="188" y="278" fill="#222222" font-family="Arial, sans-serif" font-size="22">Tell me about your trip and I&apos;ll help you</text>
  <text x="188" y="314" fill="#222222" font-family="Arial, sans-serif" font-size="22">discover a stay, an experience and</text>
  <text x="188" y="350" fill="#222222" font-family="Arial, sans-serif" font-size="22">somewhere great to eat.</text>

  <rect x="610" y="246" width="286" height="74" rx="24" fill="#FF385C"/>
  <text x="644" y="292" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="600">Plan a weekend trip</text>

  <rect x="164" y="430" width="790" height="234" rx="34" fill="#F7F7F7"/>
  <text x="192" y="472" fill="#222222" font-family="Arial, sans-serif" font-size="22" font-weight="600">Here are three recommendations for your Kyoto weekend.</text>

  <g transform="translate(188 500)">
