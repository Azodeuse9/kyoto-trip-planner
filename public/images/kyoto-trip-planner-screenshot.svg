    <rect width="220" height="74" rx="26" fill="#EAE1D7"/>
    <rect x="14" y="18" width="76" height="20" rx="10" fill="#F7F7F7"/>
    <text x="28" y="33" fill="#222222" font-family="Arial, sans-serif" font-size="10" font-weight="700">STAY</text>
    <text x="18" y="92" fill="#222222" font-family="Arial, sans-serif" font-size="18" font-weight="700">Gion Machiya House</text>
    <text x="18" y="110" fill="#717171" font-family="Arial, sans-serif" font-size="12">Gion, Kyoto</text>
  </g>

  <g transform="translate(432 500)">
    <rect width="220" height="124" rx="26" fill="white" stroke="#EBEBEB"/>
    <rect width="220" height="74" rx="26" fill="#DDE9E2"/>
    <rect x="14" y="18" width="107" height="20" rx="10" fill="#F7F7F7"/>
