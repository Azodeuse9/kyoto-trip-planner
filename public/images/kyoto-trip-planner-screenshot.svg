    <text x="18" y="92" fill="#222222" font-family="Arial, sans-serif" font-size="18" font-weight="700">Matcha tea ceremony</text>
    <text x="18" y="110" fill="#717171" font-family="Arial, sans-serif" font-size="12">Uji, Kyoto</text>
